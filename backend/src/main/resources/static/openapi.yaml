openapi: 3.1.0
info:
  title: KONE FAQ API
  version: 0.2.0
  description: |
    로그인·세션 인증, FAQ 조회, 관리자 회원 관리 API 계약입니다.
    로그인 전 GET /api/auth/csrf로 CSRF 토큰을 받은 뒤 변경 요청에 응답의 headerName을 헤더로 전달합니다.
    FAQ 상세 본문 필드는 answer가 아니라 content입니다.
servers:
  - url: http://localhost:8080
    description: local development
tags:
  - name: Auth
  - name: FAQ
  - name: Statistics
  - name: Admin Members
paths:
  /api/auth/login:
    post:
      tags: [Auth]
      summary: 로그인
      description: CSRF 토큰을 포함해 요청합니다. 성공하면 서버 세션을 만들고 세션 쿠키를 응답합니다.
      operationId: login
      security: []
      parameters:
        - name: X-CSRF-TOKEN
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 성공
          headers:
            Set-Cookie:
              schema:
                type: string
              description: JSESSIONID 서버 세션 쿠키. 로컬 설정은 SameSite=Lax입니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentMember'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/auth/csrf:
    get:
      tags: [Auth]
      summary: CSRF 요청 토큰 조회
      operationId: getCsrfToken
      security: []
      responses:
        '200':
          description: 로그인·상태 변경 요청에 사용할 CSRF 헤더 이름과 토큰
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
  /api/auth/logout:
    post:
      tags: [Auth]
      summary: 로그아웃
      description: CSRF 토큰을 포함해 요청하고 서버 세션을 종료합니다.
      operationId: logout
      security:
        - sessionCookie: []
      parameters:
        - name: X-CSRF-TOKEN
          in: header
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 세션 종료
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/auth/me:
    get:
      tags: [Auth]
      summary: 현재 로그인 회원 조회
      operationId: getCurrentMember
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 로그인 회원 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/faq-categories:
    get:
      tags: [FAQ]
      summary: 사용 가능한 FAQ 대분류 조회
      operationId: listFaqCategories
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 대분류 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FaqCategory'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/faqs:
    get:
      tags: [FAQ]
      summary: FAQ 검색 및 목록 조회
      description: 검색어는 FAQ ID·제목·내용·키워드에서 조회합니다. 검색 결과는 ID 일치, 제목 일치·포함, 검색어 단어의 제목·키워드 일치, 내용 일치 순으로 정렬하고 같은 순위에서는 제목 일치 수와 최신순을 적용합니다. 검색어가 없으면 sort 기준을 적용합니다.
      operationId: listFaqs
      security:
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          description: ID·제목·내용·키워드 검색어
          schema:
            type: string
            maxLength: 200
        - name: categoryId
          in: query
          description: faq_categories의 대분류 ID
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: topic
          in: query
          description: 세부 주제
          schema:
            type: string
            maxLength: 100
        - name: page
          in: query
          description: 기존 FAQ 화면 URL 상태와 맞춘 1부터 시작하는 페이지 번호
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          description: 페이지당 항목 수, 1~100
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: sort
          in: query
          description: 검색어가 없을 때의 정렬 기준
          schema:
            type: string
            enum: [popular, recent]
            default: popular
      responses:
        '200':
          description: 검색 결과 페이지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaqPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/faqs/highlights:
    get:
      tags: [FAQ]
      summary: 첫 화면의 최근 조회 현황 조회
      description: 전체 사용자의 최근 7일 FAQ 순위와 오늘의 주제별 열람 순위, 현재 로그인 사용자의 최근 열람 항목을 반환합니다.
      operationId: getFaqHighlights
      security:
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          description: 각 목록에 표시할 항목 수, 1~10
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 5
      responses:
        '200':
          description: 첫 화면 조회 현황
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaqHighlights'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/faqs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [FAQ]
      summary: FAQ 상세 조회
      operationId: getFaq
      security:
        - sessionCookie: []
      responses:
        '200':
          description: FAQ 상세 항목
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Faq'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/faq-statistics:
    get:
      tags: [Statistics]
      summary: FAQ 대분류별 열람 통계 조회
      description: 선택한 대분류의 최근 7일·30일·90일 FAQ 열람 기록을 집계합니다. 검색 횟수가 아니라 FAQ 상세 열람 횟수 기준이며 계정별 상세 기록은 반환하지 않습니다.
      operationId: getFaqStatistics
      security:
        - sessionCookie: []
      parameters:
        - name: categoryId
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: days
          in: query
          description: 오늘을 포함한 날짜 수
          schema:
            type: integer
            enum: [7, 30, 90]
            default: 30
      responses:
        '200':
          description: 대분류별 FAQ 열람 통계
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaqStatistics'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/faqs/{id}/open:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      tags: [FAQ]
      summary: FAQ 열기 횟수 집계
      description: FAQ가 실제로 열릴 때 한 번 호출합니다. 전체 누적 열람 횟수와 사용자별 최근 열람 이력을 함께 기록합니다.
      operationId: recordFaqOpen
      security:
        - sessionCookie: []
      parameters:
        - name: X-CSRF-TOKEN
          in: header
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 집계 반영
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/admin/members:
    get:
      tags: [Admin Members]
      summary: 회원 목록 조회
      description: 관리자 전용. username 일부 문자열로 검색합니다.
      operationId: listMembers
      security:
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          description: username 검색어, 최대 100자
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: 비밀번호를 제외한 회원 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Admin Members]
      summary: 상담원 계정 개설
      description: 관리자 전용. 새 계정은 COUNSELOR 역할로 생성합니다.
      operationId: createMember
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMemberRequest'
      responses:
        '201':
          description: 계정 생성
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/admin/members/{memberId}:
    parameters:
      - name: memberId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    put:
      tags: [Admin Members]
      summary: 회원 비밀번호 변경
      description: 관리자 전용. 비밀번호는 해시해 저장합니다.
      operationId: updateMember
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRequest'
      responses:
        '200':
          description: 수정된 회원 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Admin Members]
      summary: 회원 계정 삭제
      description: 관리자 전용. 현재 로그인 계정과 마지막 관리자는 삭제할 수 없습니다.
      operationId: deleteMember
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: 계정 삭제
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  parameters:
    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      schema:
        type: string
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    CsrfToken:
      type: object
      required: [headerName, token]
      properties:
        headerName:
          type: string
          example: X-CSRF-TOKEN
        token:
          type: string
    CurrentMember:
      type: object
      required: [id, username, role]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        role:
          type: string
          enum: [COUNSELOR, ADMIN]
    Member:
      type: object
      required: [id, username, role]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        role:
          type: string
          enum: [COUNSELOR, ADMIN]
    CreateMemberRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          format: password
          minLength: 8
          description: 최소 8자, UTF-8 기준 최대 72바이트
    UpdateMemberRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          format: password
          minLength: 8
          description: 최소 8자, UTF-8 기준 최대 72바이트
    FaqCategory:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    Faq:
      type: object
      required: [id, category, topic, title, content, keywords]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        category:
          type: string
        topic:
          type: string
        title:
          type: string
        content:
          type: string
          description: DB에 저장된 승인 안내 본문
        keywords:
          type: array
          items:
            type: string
    FaqPage:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FaqSummary'
        page:
          type: integer
          description: 1부터 시작하는 페이지 번호
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    FaqHighlights:
      type: object
      required: [mostViewedLast7Days, recentlyViewed, topicsMostViewedToday]
      properties:
        mostViewedLast7Days:
          type: array
          description: 전체 사용자 기준 최근 7일 조회수 순 FAQ
          items:
            $ref: '#/components/schemas/FaqMostViewed'
        recentlyViewed:
          type: array
          description: 현재 로그인 사용자가 최근에 연 FAQ를 항목별 최신순으로 반환
          items:
            $ref: '#/components/schemas/FaqSummary'
        topicsMostViewedToday:
          type: array
          description: 전체 사용자 기준 오늘 카테고리·주제별 열람 횟수 순위
          items:
            $ref: '#/components/schemas/FaqTopicView'
    FaqMostViewed:
      type: object
      required: [id, category, topic, title, contentSnippet, viewCount]
      properties:
        id:
          type: integer
          format: int64
        category:
          type: string
        topic:
          type: string
        title:
          type: string
        contentSnippet:
          type: string
        viewCount:
          type: integer
          format: int64
          description: 최근 7일 열람 횟수
    FaqTopicView:
      type: object
      required: [category, topic, viewCount]
      properties:
        category:
          type: string
        topic:
          type: string
        viewCount:
          type: integer
          format: int64
    FaqStatistics:
      type: object
      required: [categoryId, category, days, totalFaqCount, viewCount, viewedFaqCount, uniqueViewerCount, dailyViews, topicViews, topFaqs]
      properties:
        categoryId:
          type: integer
          format: int64
        category:
          type: string
        days:
          type: integer
        totalFaqCount:
          type: integer
          format: int64
          description: 해당 대분류에 등록된 FAQ 수
        viewCount:
          type: integer
          format: int64
          description: 선택 기간의 FAQ 총 열람 횟수
        viewedFaqCount:
          type: integer
          format: int64
          description: 선택 기간에 한 번 이상 열람된 서로 다른 FAQ 수
        uniqueViewerCount:
          type: integer
          format: int64
          description: 선택 기간에 한 번 이상 열람한 서로 다른 계정 수
        dailyViews:
          type: array
          items:
            $ref: '#/components/schemas/FaqDailyStats'
        topicViews:
          type: array
          items:
            $ref: '#/components/schemas/FaqTopicStats'
        topFaqs:
          type: array
          items:
            $ref: '#/components/schemas/FaqTopItemStats'
    FaqDailyStats:
      type: object
      required: [date, viewCount, uniqueViewerCount]
      properties:
        date:
          type: string
          format: date
        viewCount:
          type: integer
          format: int64
        uniqueViewerCount:
          type: integer
          format: int64
    FaqTopicStats:
      type: object
      required: [topic, viewCount]
      properties:
        topic:
          type: string
        viewCount:
          type: integer
          format: int64
    FaqTopItemStats:
      type: object
      required: [id, topic, title, viewCount]
      properties:
        id:
          type: integer
          format: int64
        topic:
          type: string
        title:
          type: string
        viewCount:
          type: integer
          format: int64
          description: 선택 기간의 FAQ 열람 횟수
    FaqSummary:
      type: object
      required: [id, category, topic, title, contentSnippet]
      properties:
        id:
          type: integer
          format: int64
        category:
          type: string
        topic:
          type: string
        title:
          type: string
        contentSnippet:
          type: string
          description: FAQ 본문의 앞부분 일부
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
  responses:
    BadRequest:
      description: 요청 값 오류
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: 로그인 필요 또는 인증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: 해당 권한으로 실행할 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: username 중복 또는 삭제 제한 위반
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: 요청 항목 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
