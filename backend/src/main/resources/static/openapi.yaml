openapi: 3.1.0
info:
  title: KONE FAQ API
  version: 0.1.0-draft
  description: |
    명세 우선 개발을 위한 초안입니다. 경로·필드·권한은 프로젝트 기획과 기존 화면을 바탕으로 정리했으며,
    사용자 검토 후 서버 구현 전에 확정해야 합니다. FAQ 상세 본문 필드는 answer가 아니라 content입니다.
servers:
  - url: http://localhost:8080
    description: local development
tags:
  - name: Auth
  - name: FAQ
  - name: Admin Members
paths:
  /api/auth/login:
    post:
      tags: [Auth]
      summary: 로그인
      description: 성공하면 서버 세션을 만들고 세션 쿠키를 응답합니다.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 성공
          headers:
            Set-Cookie:
              schema:
                type: string
              description: 서버 세션 쿠키. 실제 쿠키 속성은 구현·배포 환경에서 확정합니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentMember'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/logout:
    post:
      tags: [Auth]
      summary: 로그아웃
      operationId: logout
      security:
        - sessionCookie: []
      responses:
        '204':
          description: 세션 종료
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/me:
    get:
      tags: [Auth]
      summary: 현재 로그인 회원 조회
      operationId: getCurrentMember
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 로그인 회원 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/faq-categories:
    get:
      tags: [FAQ]
      summary: 사용 가능한 FAQ 대분류 조회
      operationId: listFaqCategories
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 대분류 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FaqCategory'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/faqs:
    get:
      tags: [FAQ]
      summary: FAQ 검색 및 목록 조회
      description: 검색어가 있으면 관련도순, 검색어가 비어 있으면 기본 정렬 정책을 적용합니다. 실제 검색 로직은 별도 구현 결정입니다.
      operationId: listFaqs
      security:
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          description: ID·제목·내용·키워드 검색어
          schema:
            type: string
        - name: categoryId
          in: query
          description: faq_categories의 대분류 ID
          schema:
            type: string
        - name: topic
          in: query
          description: 세부 주제
          schema:
            type: string
        - name: page
          in: query
          description: 기존 FAQ 화면 URL 상태와 맞춘 1부터 시작하는 페이지 번호
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            default: 20
        - name: sort
          in: query
          description: 검색어가 없을 때의 정렬 기준. 최종 동작은 기획 검토 후 확정합니다.
          schema:
            type: string
            enum: [popular, recent]
            default: popular
      responses:
        '200':
          description: 검색 결과 페이지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaqPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/faqs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [FAQ]
      summary: FAQ 상세 조회
      operationId: getFaq
      security:
        - sessionCookie: []
      responses:
        '200':
          description: FAQ 상세 항목
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Faq'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/faqs/{id}/open:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      tags: [FAQ]
      summary: FAQ 열기 횟수 집계
      description: FAQ가 실제로 열릴 때 한 번 호출합니다. 사용자별 열람 이력은 저장하지 않습니다.
      operationId: recordFaqOpen
      security:
        - sessionCookie: []
      responses:
        '204':
          description: 집계 반영
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/admin/members:
    get:
      tags: [Admin Members]
      summary: 회원 목록 조회
      description: 관리자 전용 기능입니다.
      operationId: listMembers
      security:
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          description: 표시 이름 또는 로그인 ID 검색
          schema:
            type: string
      responses:
        '200':
          description: 회원 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Admin Members]
      summary: 상담원 계정 개설
      description: 관리자 전용 기능입니다.
      operationId: createMember
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMemberRequest'
      responses:
        '201':
          description: 계정 생성
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/admin/members/{memberId}:
    parameters:
      - name: memberId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    put:
      tags: [Admin Members]
      summary: 회원 정보 수정
      description: 관리자 전용 기능입니다.
      operationId: updateMember
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRequest'
      responses:
        '200':
          description: 수정된 회원
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Admin Members]
      summary: 회원 계정 삭제
      description: 관리자 전용 기능입니다.
      operationId: deleteMember
      security:
        - sessionCookie: []
      responses:
        '204':
          description: 계정 삭제
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    CurrentMember:
      type: object
      required: [id, name, username, role]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        username:
          type: string
        role:
          type: string
          enum: [COUNSELOR, ADMIN]
    Member:
      type: object
      required: [id, name, username, role]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        username:
          type: string
        role:
          type: string
          enum: [COUNSELOR, ADMIN]
    CreateMemberRequest:
      type: object
      required: [name, username, password]
      properties:
        name:
          type: string
        username:
          type: string
        password:
          type: string
          format: password
    UpdateMemberRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        password:
          type: string
          format: password
          description: 비밀번호 변경 시에만 전달
    FaqCategory:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    Faq:
      type: object
      required: [id, category, topic, title, content, keywords]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        category:
          type: string
        topic:
          type: string
        title:
          type: string
        content:
          type: string
          description: 승인된 안내 본문. 렌더링 형식은 구현 전에 확정합니다.
        keywords:
          type: array
          items:
            type: string
    FaqPage:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FaqSummary'
        page:
          type: integer
          description: 1부터 시작하는 페이지 번호
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    FaqSummary:
      type: object
      required: [id, category, topic, title]
      properties:
        id:
          type: integer
          format: int64
        category:
          type: string
        topic:
          type: string
        title:
          type: string
        contentSnippet:
          type: string
          description: 검색 결과에서 필요한 경우 제공하는 내용 일부
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
  responses:
    BadRequest:
      description: 요청 값 오류
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: 로그인 필요 또는 인증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: 해당 권한으로 실행할 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: 요청 항목 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: 로그인 ID 중복 등 데이터 충돌
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
