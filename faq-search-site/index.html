<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f8fa">
    <title>FAQ 검색 | K-ONE SeoulEdu</title>
    <link rel="stylesheet" href="assets/css/common.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <script type="module" src="assets/js/components.js"></script>
    <script type="module" src="assets/js/app.js"></script>
  </head>
  <body data-section="search">
    <div data-include="components/header.html"></div>
    <div class="faq-workspace">
      <div data-include="components/faq-sidebar.html"></div>
      <div class="faq-content">
        <div class="page-shell">
          <main>
        <section class="hero" aria-labelledby="page-title">
          <p class="eyebrow">빠르게 찾고, 정확하게 안내하세요</p>
          <div class="hero-title-row">
            <h1 id="page-title">무엇을 도와드릴까요?</h1>
            <details class="help-tip">
              <summary aria-label="검색 사용 도움말">?</summary>
              <span class="help-tip-content">검색어를 입력하거나 구분과 주제를 선택해 FAQ를 찾아보세요.</span>
            </details>
          </div>

          <form class="search-form" role="search">
            <label class="sr-only" for="search-input">FAQ 검색어</label>
            <svg class="search-icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 4.5 4.5"></path></svg>
            <input id="search-input" name="q" type="search" placeholder="예: 애플 펜슬, 수리 접수" autocomplete="off">
            <kbd>Enter</kbd>
          </form>

          <div class="filters" aria-label="FAQ 필터">
            <label class="filter-control">
              <span class="sr-only">구분</span>
              <select id="category-filter" aria-label="구분">
                <option value="">모든 구분</option>
                <option>A/S 및 구매</option>
                <option>2027년 양품화 사업</option>
                <option>디벗 재배치 사업</option>
                <option>기타</option>
              </select>
            </label>
            <label class="filter-control">
              <span class="sr-only">주제</span>
              <select id="topic-filter" aria-label="주제" disabled>
                <option value="">모든 주제</option>
              </select>
            </label>
            <button class="reset-button" id="reset-filters" type="button">초기화</button>
          </div>
        </section>

        <section class="results-section" aria-labelledby="results-heading">
          <div class="results-toolbar">
            <div>
              <h2 id="results-heading">자주 찾는 질문</h2>
              <p class="result-count" id="result-count" aria-live="polite">FAQ 데이터를 준비하고 있습니다.</p>
            </div>
            <span class="sort-label">최근 등록순 <img class="chevron-icon" src="assets/img/chevron-down.svg" alt="" aria-hidden="true" width="14" height="14"></span>
          </div>
          <div id="results" class="results-list" aria-live="polite" aria-busy="true"></div>
          <nav id="pagination" class="pagination" aria-label="결과 페이지"></nav>
        </section>
          </main>
        </div>
        <div data-include="components/footer.html"></div>
      </div>
    </div>
  </body>
</html>
