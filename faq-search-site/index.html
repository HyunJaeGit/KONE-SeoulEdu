<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f8fa">
    <title>FAQ 검색 | KONE SeoulEdu</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script type="module" src="assets/js/app.js"></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="./" aria-label="FAQ 검색 홈">
          <span class="brand-mark" aria-hidden="true">K</span>
          <span>KONE <span class="brand-light">SEOUL EDU</span></span>
        </a>
        <div class="header-actions">
          <span class="header-label">상담 지원 FAQ</span>
          <button id="header-auth-action" class="header-login" type="button">로그인</button>
          <div id="account-menu" class="account-menu" hidden>
            <button id="account-menu-trigger" class="account-trigger" type="button" aria-expanded="false" aria-controls="account-menu-panel">
              <span class="account-avatar" aria-hidden="true">?</span>
              <span id="account-username">사용자</span>
              <span class="account-chevron" aria-hidden="true">⌄</span>
            </button>
            <div id="account-menu-panel" class="account-menu-panel" hidden>
              <span id="account-role" class="account-role"></span>
              <a id="admin-page-link" href="admin.html" hidden>관리자 페이지</a>
            </div>
          </div>
        </div>
      </header>

      <main>
        <section class="hero" aria-labelledby="page-title">
          <p class="eyebrow">빠르게 찾고, 정확하게 안내하세요</p>
          <h1 id="page-title">무엇을 도와드릴까요?</h1>
          <p class="hero-copy">궁금한 내용을 검색하거나 구분과 주제를 선택해 보세요.</p>

          <form class="search-form" role="search">
            <label class="sr-only" for="search-input">FAQ 검색어</label>
            <svg class="search-icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 4.5 4.5"></path></svg>
            <input id="search-input" name="q" type="search" placeholder="예: 애플 펜슬, 수리 접수" autocomplete="off">
            <kbd>Enter</kbd>
          </form>

          <div class="filters" aria-label="FAQ 필터">
            <label class="filter-control">
              <span class="sr-only">구분</span>
              <select id="category-filter" aria-label="구분">
                <option value="">모든 구분</option>
                <option>양품화 사업</option>
                <option>학교 업무</option>
                <option>유지보수</option>
                <option>재배치·여분 기기</option>
                <option>문의</option>
              </select>
            </label>
            <label class="filter-control">
              <span class="sr-only">주제</span>
              <select id="topic-filter" aria-label="주제" disabled>
                <option value="">모든 주제</option>
              </select>
            </label>
            <button class="reset-button" id="reset-filters" type="button">초기화</button>
          </div>
        </section>

        <section class="results-section" aria-labelledby="results-heading">
          <div class="results-toolbar">
            <div>
              <h2 id="results-heading">자주 찾는 질문</h2>
              <p class="result-count" id="result-count" aria-live="polite">FAQ 데이터를 준비하고 있습니다.</p>
            </div>
            <span class="sort-label">최근 등록순 <span aria-hidden="true">⌄</span></span>
          </div>
          <div id="results" class="results-list" aria-live="polite" aria-busy="true"></div>
          <nav id="pagination" class="pagination" aria-label="결과 페이지"></nav>
        </section>
      </main>

      <footer class="site-footer">
        <span>KONE SeoulEdu</span>
        <span>상담 업무를 위한 FAQ 검색</span>
      </footer>
    </div>
  </body>
</html>
