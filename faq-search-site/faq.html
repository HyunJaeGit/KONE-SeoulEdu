<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f8fa">
    <title>FAQ 찾아보기 | K-ONE SeoulEdu</title>
    <link rel="stylesheet" href="assets/css/common.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/browse.css">
    <script type="module" src="assets/js/components.js"></script>
    <script type="module" src="assets/js/browse.js"></script>
  </head>
  <body data-section="faq">
    <div data-include="components/header.html"></div>
    <div class="faq-workspace">
      <div data-include="components/faq-sidebar.html"></div>
      <div class="faq-content">
        <main class="page-shell browse-shell">
          <section id="faq-overview" aria-labelledby="browse-title">
            <p class="eyebrow">FAQ BROWSE</p>
            <h1 id="browse-title">FAQ 찾아보기</h1>
            <p class="browse-intro">큰 카테고리를 선택해 관련 질문과 답변을 확인하세요.</p>
            <div id="category-cards" class="category-cards" aria-live="polite"></div>
          </section>
          <section id="faq-category-view" class="faq-category-view" aria-labelledby="category-title" hidden>
            <a class="browse-back" href="faq.html">전체 카테고리</a>
            <div class="browse-heading">
              <div>
                <p class="eyebrow">FAQ CATEGORY</p>
                <h1 id="category-title"></h1>
                <p class="result-count" id="result-count" aria-live="polite">FAQ 데이터를 준비하고 있습니다.</p>
              </div>
              <span class="sort-label">최근 등록순 <img class="chevron-icon" src="assets/img/chevron-down.svg" alt="" aria-hidden="true" width="14" height="14"></span>
            </div>
            <div id="results" class="results-list" aria-live="polite" aria-busy="true"></div>
            <nav id="pagination" class="pagination" aria-label="결과 페이지"></nav>
          </section>
        </main>
        <div data-include="components/footer.html"></div>
      </div>
    </div>
  </body>
</html>
