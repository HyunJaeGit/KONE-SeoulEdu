<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f8fa">
    <title>FAQ 목록 | K-ONE SeoulEdu</title>
    <link rel="stylesheet" href="assets/css/common.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/browse.css">
    <script type="module" src="assets/js/components.js?v=4"></script>
    <script type="module" src="assets/js/browse.js"></script>
  </head>
  <body data-section="faq">
    <div data-include="components/header.html"></div>
    <div class="faq-workspace">
      <div data-include="components/faq-sidebar.html"></div>
      <div class="faq-content">
        <main class="page-shell browse-shell">
          <section aria-labelledby="browse-title">
            <div class="browse-toolbar">
              <h1 id="browse-title">FAQ 목록</h1>
              <div class="browse-filters" aria-label="FAQ 분류 필터">
                <label class="browse-category-select">
                  <span>카테고리</span>
                  <select id="browse-category-filter" aria-label="FAQ 카테고리">
                    <option value="">전체 카테고리</option>
                  </select>
                </label>
                <label class="browse-category-select">
                  <span>세부 주제</span>
                  <select id="browse-topic-filter" aria-label="FAQ 세부 주제" disabled>
                    <option value="">전체 주제</option>
                  </select>
                </label>
              </div>
            </div>
            <div class="browse-results-toolbar">
              <p class="result-count" id="result-count" aria-live="polite">FAQ 데이터를 준비하고 있습니다.</p>
              <label class="browse-sort-control">
                <span class="sr-only">FAQ 정렬</span>
                <select id="browse-sort" aria-label="FAQ 정렬">
                  <option value="recent">최근 등록순</option>
                  <option value="popular">조회수 높은순</option>
                  <option value="least">조회수 낮은순</option>
                </select>
              </label>
            </div>
            <div id="results" class="results-list" aria-live="polite" aria-busy="true"></div>
            <nav id="pagination" class="pagination" aria-label="결과 페이지"></nav>
          </section>
        </main>
        <div data-include="components/footer.html"></div>
      </div>
    </div>
  </body>
</html>
