<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f8fa">
    <title>로그인 | K-ONE SeoulEdu FAQ</title>
    <link rel="stylesheet" href="assets/css/common.css">
    <link rel="stylesheet" href="assets/css/auth.css">
    <script type="module" src="assets/js/components.js?v=4"></script>
    <script type="module" src="assets/js/auth.js"></script>
  </head>
  <body class="login-page" data-page="login">
    <div data-include="components/header.html"></div>
    <main class="auth-shell">
      <section class="auth-card" aria-labelledby="auth-title">
        <div class="auth-heading">
          <div class="auth-title-with-help">
            <h1 id="auth-title">로그인</h1>
            <details class="help-tip">
              <summary aria-label="로그인 도움말">?</summary>
              <span class="help-tip-content" id="auth-description">계정 정보를 입력해 로그인하세요.</span>
            </details>
          </div>
        </div>

        <div class="mode-switch" role="group" aria-label="로그인 유형">
          <button type="button" class="mode-button is-active" data-mode="user" aria-pressed="true">일반 로그인</button>
          <button type="button" class="mode-button" data-mode="admin" aria-pressed="false">관리자 모드</button>
        </div>

        <form id="login-form" class="auth-form">
          <label for="login-id">아이디</label>
          <input id="login-id" name="username" autocomplete="username" required placeholder="아이디를 입력하세요">

          <label for="login-password">비밀번호</label>
          <div class="password-field">
            <input id="login-password" name="password" type="password" autocomplete="current-password" required placeholder="비밀번호를 입력하세요">
            <button class="password-toggle" type="button" data-toggle-password="login-password" aria-label="비밀번호 표시">표시</button>
          </div>

          <p class="form-message" id="login-message" role="status" aria-live="polite"></p>
          <button class="primary-button" type="submit">로그인</button>
        </form>

        <div class="auth-divider"><span>계정 관리</span></div>
        <div class="account-note-row">
          <span>계정 발급 안내</span>
          <details class="help-tip">
            <summary aria-label="계정 발급 안내">?</summary>
            <span class="help-tip-content">계정은 관리자만 생성할 수 있습니다. 계정 발급이 필요하면 담당 관리자에게 문의하세요.</span>
          </details>
        </div>
        <a class="admin-link" href="admin.html">관리자 계정 관리 <span aria-hidden="true">→</span></a>
      </section>

    </main>
    <div data-include="components/footer.html"></div>
  </body>
</html>
