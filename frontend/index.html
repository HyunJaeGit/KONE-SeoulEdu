<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f8fa">
    <title>FAQ 검색 | K-ONE SeoulEdu</title>
    <link rel="stylesheet" href="assets/css/common.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <script type="module" src="assets/js/components.js?v=4"></script>
    <script type="module" src="assets/js/app.js"></script>
  </head>
  <body data-section="search">
    <div data-include="components/header.html"></div>
    <div class="faq-workspace">
      <div data-include="components/faq-sidebar.html"></div>
      <div class="faq-content">
        <div class="page-shell">
          <main>
        <section class="hero" aria-label="FAQ 검색">

          <form class="search-form" role="search">
            <label class="sr-only" for="search-input">FAQ 검색어</label>
            <svg class="search-icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 4.5 4.5"></path></svg>
            <input id="search-input" name="q" type="search" placeholder="예: 애플 펜슬, 수리 접수" autocomplete="off">
            <kbd>Enter</kbd>
          </form>

          <div class="filters" aria-label="FAQ 필터">
            <label class="filter-control">
              <span class="sr-only">구분</span>
              <select id="category-filter" aria-label="구분">
                <option value="">모든 구분</option>
                <option>유지보수</option>
                <option>2027년 양품화 사업</option>
                <option>2027년 디벗 재배치·여분기기 수거 사업</option>
              </select>
            </label>
            <label class="filter-control">
              <span class="sr-only">주제</span>
              <select id="topic-filter" aria-label="주제" disabled>
                <option value="">모든 주제</option>
              </select>
            </label>
            <button class="reset-button" id="reset-filters" type="button">초기화</button>
          </div>

          <section id="recent-searches" class="recent-searches" aria-label="최근 검색어" hidden>
            <h2 class="recent-searches-label">최근 검색</h2>
            <div id="recent-search-list" class="recent-search-list"></div>
            <button id="clear-recent-searches" class="clear-recent-searches" type="button">기록 지우기</button>
          </section>
        </section>

        <section id="home-highlights" class="home-highlights" aria-label="FAQ 최근 조회 목록" hidden>
          <p id="highlights-status" class="highlights-status" aria-live="off">30초마다 자동 갱신</p>
          <span id="dashboard-announcement" class="sr-only" aria-live="polite" aria-atomic="true"></span>
          <div class="highlights-grid">
            <section class="highlight-panel" aria-labelledby="weekly-views-heading">
              <div class="highlight-toolbar">
                <div>
                  <h2 id="weekly-views-heading">최근 7일 조회수 순</h2>
                  <p class="result-count">전체 사용자가 최근 7일 동안 열어본 항목</p>
                </div>
              </div>
              <ol id="weekly-views-list" class="highlight-list" aria-live="off" aria-busy="true"></ol>
            </section>

            <section class="highlight-panel" aria-labelledby="recent-views-heading">
              <div class="highlight-toolbar">
                <div>
                  <h2 id="recent-views-heading">최근 찾은 항목</h2>
                  <p class="result-count">내가 최근에 열어본 항목</p>
                </div>
              </div>
              <ol id="recent-views-list" class="highlight-list" aria-live="off" aria-busy="true"></ol>
            </section>
          </div>
          <section class="topic-analytics" aria-labelledby="topic-analytics-heading">
            <div class="topic-analytics-heading">
              <div>
                <h2 id="topic-analytics-heading">오늘 많이 조회된 주제</h2>
                <p class="result-count">전체 사용자 당일 열람 · 막대 길이는 1위 대비 비율</p>
              </div>
            </div>
            <ol id="topic-analytics-list" class="topic-analytics-list" aria-label="조회가 많은 주제"></ol>
          </section>
        </section>

        <section id="results-section" class="results-section" aria-labelledby="results-heading">
          <div class="results-toolbar">
            <div>
              <h2 id="results-heading">FAQ 검색 결과</h2>
              <p class="result-count" id="result-count" aria-live="polite">FAQ 데이터를 준비하고 있습니다.</p>
            </div>
            <span class="sort-label">누적 조회순 <img class="chevron-icon" src="assets/img/chevron-down.svg" alt="" aria-hidden="true" width="14" height="14"></span>
          </div>
          <div id="results" class="results-list" aria-live="polite" aria-busy="true"></div>
          <nav id="pagination" class="pagination" aria-label="결과 페이지"></nav>
        </section>
          </main>
        </div>
        <div data-include="components/footer.html"></div>
      </div>
    </div>
  </body>
</html>
